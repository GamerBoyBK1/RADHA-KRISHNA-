<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CoRamTix Cloud - Coming Soon</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-blue-600 to-indigo-800 flex items-center justify-center min-h-screen text-white">
  <div class="text-center space-y-6">
    <!-- Logo -->
    <div class="flex justify-center">
      <div class="w-24 h-24 bg-white rounded-2xl flex items-center justify-center shadow-lg p-2">
        <svg width="64" height="64" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" 
                fill="#1a73e8" 
                stroke="#1a73e8" 
                stroke-width="0.5"/>
        </svg>
      </div>
    </div>

    <!-- Title -->
    <h1 class="text-5xl font-extrabold tracking-wide">CoRamTix Cloud</h1>
    <p class="text-lg text-gray-200">Something amazing is coming soon</p>

    <!-- Countdown -->
    <div class="flex justify-center gap-6 text-center font-mono">
      <div>
        <p id="days" class="text-4xl font-bold">00</p>
        <span class="text-sm">Days</span>
      </div>
      <div>
        <p id="hours" class="text-4xl font-bold">00</p>
        <span class="text-sm">Hours</span>
      </div>
      <div>
        <p id="minutes" class="text-4xl font-bold">00</p>
        <span class="text-sm">Minutes</span>
      </div>
      <div>
        <p id="seconds" class="text-4xl font-bold">00</p>
        <span class="text-sm">Seconds</span>
      </div>
    </div>

    <!-- Email notify -->
    <div class="mt-6">
      <input type="email" placeholder="Enter your email" class="px-4 py-2 rounded-l-md text-black focus:outline-none" />
      <button class="bg-white text-blue-600 px-4 py-2 rounded-r-md font-semibold hover:bg-gray-100">Notify Me</button>
    </div>

    <p class="text-sm text-gray-300 mt-6">© 2025 CoRamTix Cloud. All rights reserved.</p>
  </div>

  <script>
    // Countdown to specific date
    const countdownDate = new Date("Sep 28, 2025 00:00:00").getTime();

    const timer = setInterval(() => {
      const now = new Date().getTime();
      const distance = countdownDate - now;

      const days = Math.floor(distance / (1000 * 60 * 60 * 24));
      const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
      const seconds = Math.floor((distance % (1000 * 60)) / 1000);

      document.getElementById("days").innerText = days;
      document.getElementById("hours").innerText = hours;
      document.getElementById("minutes").innerText = minutes;
      document.getElementById("seconds").innerText = seconds;

      if (distance < 0) {
        clearInterval(timer);
        document.querySelector(".text-lg").innerText = "We are live now!";
      }
    }, 1000);
  </script>
</body>
</html>
